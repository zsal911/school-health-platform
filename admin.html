<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة التوعية الصحية المدرسية</title><style>body{font-family:Tahoma,Arial;background:#f4f8fa;color:#173b5f;margin:0}main{max-width:1100px;margin:auto;padding:30px 18px}h1{font-size:25px}section{background:white;border:1px solid #e1ebee;border-radius:16px;padding:20px;margin:18px 0}input,button,select{font:inherit;padding:12px;border:1px solid #d9e3e9;border-radius:9px;margin:5px}button{background:#126c78;color:white;cursor:pointer}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #e7eff2;text-align:right;vertical-align:top}a{color:#087e82}small{color:#6b7c88}.scroll{overflow:auto}.hidden{display:none}.ok{color:#18794e}</style></head><body><main><h1>لوحة إدارة التوعية الصحية المدرسية</h1><p>خاصة بالحساب الإداري المعتمد. تقارير المدارس المرسلة للمراجعة لا تُنشر تلقائيًا.</p><section id="login"><h2>دخول الإدارة</h2><input id="email" type="email" value="p007090@outlook.com" placeholder="البريد الإداري"><input id="password" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button><button onclick="resetPassword()">نسيت كلمة المرور؟</button><p><small>الحساب الإداري موجود بالفعل. استخدمي كلمة المرور الصحيحة، أو استعيديها عند إتاحة إرسال البريد.</small></p><p id="message"></p></section><section id="dashboard" class="hidden"><button onclick="logout()">تسجيل الخروج</button><button onclick="load()">تحديث التقارير</button><button onclick="exportCSV()">تصدير Excel (CSV)</button><h2>التقارير الواردة للمراجعة</h2><p id="summary"></p><div class="scroll"><table><thead><tr><th>المدرسة</th><th>المجال</th><th>تاريخ الإرسال</th><th>البيانات</th><th>الحالة</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const url='https://lfkrzgxmkbeleegvdxwx.supabase.co',key='sb_publishable_IIxp8_3zYzBevJhdjV_Efg_WPM4Cuhc';let token='',entries=[],names={};const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,opts={}){const r=await fetch(url+'/rest/v1/'+path,{...opts,headers:{apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}});if(!r.ok)throw Error(await r.text());const t=await r.text();return t?JSON.parse(t):[]}
async function registerAdmin(){try{if($('email').value.trim().toLowerCase()!=='p007090@outlook.com')throw Error('استخدمي البريد الإداري المحدد');if($('password').value.length<8)throw Error('اختاري كلمة مرور من 8 أحرف على الأقل');const r=await fetch(url+'/auth/v1/signup',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const j=await r.json();if(!r.ok)throw Error(j.msg||j.error_description||'تعذر إنشاء الحساب');$('password').value='';$('message').textContent='تم إرسال طلب إنشاء الحساب. افحصي البريد لتأكيده. ستحتاج صلاحية الإدارة إلى التفعيل قبل أول دخول.'}catch(e){$('message').textContent=e.message}}
async function resetPassword(){const email=$('email').value.trim();if(!email){$('message').textContent='أدخلي بريدك أولًا';return}try{const r=await fetch(url+'/auth/v1/recover?redirect_to='+encodeURIComponent('https://zsal911.github.io/school-health-platform/admin.html'),{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email,redirect_to:'https://zsal911.github.io/school-health-platform/admin.html'})});if(!r.ok){const j=await r.json().catch(()=>({}));if(r.status===429)throw Error('توقفت رسائل الاستعادة مؤقتًا بسبب حد الإرسال في Supabase. لا تكرري الطلب الآن.');throw Error(j.msg||j.error_description||'تعذر إرسال طلب الاستعادة ('+r.status+')')} $('message').textContent='تم قبول طلب الاستعادة. افحصي البريد الوارد وغير الهام.'}catch(e){$('message').textContent=e.message}}
async function login(){try{$('message').textContent='جارٍ التحقق...';const r=await fetch(url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const j=await r.json();if(!r.ok||!j.access_token)throw Error('بيانات الدخول غير صحيحة');token=j.access_token;const p=await api('profiles?user_id=eq.'+encodeURIComponent(j.user.id)+'&select=role');if(!p.some(x=>x.role==='admin'))throw Error('الحساب غير مصرح له بالإدارة');$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('password').value='';await load()}catch(e){token='';$('message').textContent=e.message||'تعذر الدخول'}}
function logout(){token='';entries=[];$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');$('message').textContent='تم تسجيل الخروج'}
async function load(){try{const [s,r]=await Promise.all([api('schools?select=id,name'),api('school_submissions?select=id,school_id,section_key,submission,submitted_at,reviewed&order=submitted_at.desc&limit=1000')]);names=Object.fromEntries(s.map(x=>[x.id,x.name]));entries=r;$('summary').textContent='عدد التقارير: '+r.length+' | بانتظار المراجعة: '+r.filter(x=>!x.reviewed).length;$('rows').innerHTML=r.map(x=>'<tr><td>'+esc(names[x.school_id]||x.school_id)+'</td><td>'+esc(x.section_key)+'</td><td>'+esc(new Date(x.submitted_at).toLocaleString('ar-OM'))+'</td><td><details><summary>عرض التفاصيل</summary><pre style="white-space:pre-wrap;max-width:430px">'+esc(JSON.stringify(x.submission,null,2))+'</pre></details></td><td>'+(x.reviewed?'<span class="ok">تمت المراجعة</span>':'<button onclick="review('+x.id+')">تحديد كمراجع</button>')+'</td></tr>').join('')||'<tr><td colspan="5">لا توجد تقارير بعد</td></tr>'}catch(e){$('summary').textContent='تعذر تحميل التقارير: '+e.message}}
async function review(id){try{await api('school_submissions?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({reviewed:true})});await load()}catch(e){alert('تعذر التحديث: '+e.message)}}
function exportCSV(){const header=['المدرسة','المجال','تاريخ الإرسال','الحالة','التفاصيل'];const lines=[header,...entries.map(x=>[names[x.school_id]||x.school_id,x.section_key,x.submitted_at,x.reviewed?'تمت المراجعة':'بانتظار المراجعة',JSON.stringify(x.submission)])];const csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='school-health-submissions-2026.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

async function handleRecovery(){const hash=new URLSearchParams(location.hash.slice(1));if(hash.get('type')!=='recovery'||!hash.get('access_token'))return;const recovery=hash.get('access_token');history.replaceState(null,'',location.pathname);$('login').innerHTML='<h2>تعيين كلمة مرور جديدة</h2><p>اختاري كلمة مرور جديدة لحساب الإدارة.</p><input id="newPassword" type="password" placeholder="كلمة المرور الجديدة (8 أحرف على الأقل)"><button id="changePassword" onclick="changeRecoveryPassword()">حفظ كلمة المرور</button><p id="recoveryMessage"></p>';window.changeRecoveryPassword=async()=>{const pw=$('newPassword').value;if(pw.length<8){$('recoveryMessage').textContent='كلمة المرور قصيرة، اختاري 8 أحرف على الأقل';return}try{const r=await fetch(url+'/auth/v1/user',{method:'PUT',headers:{apikey:key,Authorization:'Bearer '+recovery,'Content-Type':'application/json'},body:JSON.stringify({password:pw})});if(!r.ok)throw Error('تعذر تغيير كلمة المرور، يرجى طلب رابط جديد');$('recoveryMessage').textContent='تم تغيير كلمة المرور بنجاح. افتحي لوحة الإدارة مجددًا وسجّلي الدخول.';$('newPassword').value=''}catch(e){$('recoveryMessage').textContent=e.message}}}
handleRecovery();
</script></body></html>
