<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>لوحة الإدارة | التوعية الصحية</title><style>body{font:16px Tahoma,Arial;background:#f1f6f8;color:#173b5f;margin:0}main{max-width:1200px;margin:auto;padding:30px 16px}section{background:white;border:1px solid #dce8eb;border-radius:16px;padding:22px;margin:20px 0}button{background:#126c78;color:white;border:0;border-radius:8px;padding:12px;margin:4px;cursor:pointer;font:inherit}table{border-collapse:collapse;width:100%}td,th{padding:12px;text-align:right;border-bottom:1px solid #e2eaee}th{background:#e8f3f5}td:nth-child(3){font-weight:bold;text-align:center}.stats{display:flex;gap:15px;flex-wrap:wrap}.stats div{flex:1;background:#e8f3f5;padding:22px;text-align:center;border-radius:12px}.stats b{display:block;font-size:32px;margin-bottom:10px}.scroll{overflow:auto}small{color:#60788a}</style><main><h1>لوحة إدارة التوعية الصحية المدرسية</h1><p>الحصر والمتابعة • عرض فقط</p><section><div class="stats" id="stats"></div><p id="status">جارٍ تحميل البيانات...</p><button onclick="load()">تحديث البيانات</button></section><section><h2>حصر المؤشرات</h2><small>الشرطة تعني عدم توفر قيمة. الحصر من آخر استجابة منشورة لكل مدرسة ومجال. ترتيب الخطة يحتاج مراجعة نهائية.</small><p><button onclick="copyNumbers()">نسخ عمود الأعداد</button><button onclick="copyTable()">نسخ الجدول</button><button onclick="download()">تصدير Excel (CSV)</button></p><div class="scroll"><table><thead><tr><th>المبادرة / المجال</th><th>المؤشر</th><th>العدد</th><th>نسخ</th></tr></thead><tbody id="rows"></tbody></table></div></section><section><h2>متابعة المدارس</h2><div id="schools"></div></section></main><script>const catalog=[{"n":1,"title":"مبادرة بيئة عمل آمنة للجميع","label":"عدد ورش العمل والبرامج التدريبية للعاملين وأصحاب العمل وسائقي الحافلات المدرسية","sec":0,"q":0,"metric":"count"},{"n":1,"title":"مبادرة بيئة عمل آمنة للجميع" ,"title":"مبادرة طفلي يتعلم","label":"عدد الأطفال المدربين على أهمية النوم الصحي","sec":3,"q":2,"metric":"ben"},{"n":10,"title":"مبادرة تطعيمنا حماية","label":"عدد المحاضرات التوعوية لأولياء الأمور عن أهمية التحصينات ضد شلل الأطفال","sec":4,"q":0,"metric":"count"},{"n":10,"title":"مبادرة تطعيمنا حماية","label":"عدد الحملات التوعوية الإعلامية عن أهمية التحصينات لصحة الطفل","sec":4,"q":1,"metric":"count"},{"n":10,"title":"مبادرة تطعيمنا حماية","label":"عدد المتطوعين المتدربين لتوعية أفراد المجتمع عن أهمية التحصينات","sec":4,"q":2,"metric":"num"},{"n":11,"title":"مبادرة كن واعيا","label":"عدد المحاضرات التوعوية حول مرض نقص المناعة المكتسب (الإيدز)","sec":5,"q":0,"metric":"count"},{"n":11,"title":"مبادرة كن واعيا","label":"عدد ورش العمل للتربويين والمختصين حول مرض الإيدز","sec":5,"q":1,"metric":"count"},{"n":11,"title":"مبادرة كن واعيا","label":"عدد البرامج التوعوية للطلبة والشباب حول مرض الإيدز","sec":5,"q":2,"metric":"count"},{"n":13,"title":"مبادرة جيل صحي ومتوازن","label":"عدد ورش العمل عن كيفية إعداد وجبات صحية متوازنة","sec":6,"q":0,"metric":"count"},{"n":13,"title":"مبادرة جيل صحي ومتوازن","label":"عدد المحاضرات التوعوية عن أنماط الحياة الصحية لمكافحة السمنة والوقاية منها","sec":6,"q":1,"metric":"count"},{"n":13,"title":"مبادرة جيل صحي ومتوازن","label":"عدد الحملات التوعوية الإعلامية عن أهمية التغذية الصحية والنشاط البدني","sec":6,"q":2,"metric":"count"},{"n":14,"title":"مبادرة العيادة المدرسية الذكية","label":"عدد العيادات المدرسية المجهزة بالأدوات الصحية","sec":7,"q":0,"metric":"yes"},{"n":14,"title":"مبادرة العيادة المدرسية الذكية","label":"عدد الطلبة ذوي الحالات الصحية المزمنة المتعامل مع صحتهم في العيادة","sec":7,"q":2,"metric":"num"},{"n":14,"title":"مبادرة العيادة المدرسية الذكية","label":"عدد الاستشارات الصحية المقدمة لأولياء الأمور والكادر التعليمي","sec":7,"q":1,"metric":"num"},{"title":"البحث والابتكار الصحي","label":"عدد المشاركين في الأبحاث والدراسات الصحية","sec":8,"q":0,"metric":"num"},{"title":"البحث والابتكار الصحي","label":"عدد الأبحاث والدراسات الصحية","sec":8,"q":1,"metric":"num"},{"title":"البحث والابتكار الصحي","label":"عدد الحلول والمبادرات المطبقة","sec":8,"q":2,"metric":"num"},{"title":"البحث والابتكار الصحي","label":"عدد الشراكات البحثية","sec":8,"q":3,"metric":"num"},{"title":"البيئة المدرسية","label":"المدارس التي أعدت تقرير الإصحاح البيئي","sec":9,"q":0,"metric":"yes"},{"title":"البيئة المدرسية","label":"المدارس التي نظفت وعقمت خزانات المياه","sec":9,"q":1,"metric":"yes"},{"title":"البيئة المدرسية","label":"المدارس التي أخذت عينة مياه للفحص","sec":9,"q":2,"metric":"yes"},{"title":"البيئة المدرسية","label":"المدارس التي لديها نتيجة فحص المياه","sec":9,"q":3,"metric":"yes"},{"title":"البيئة المدرسية","label":"المدارس ذات نتيجة مياه مطابقة","sec":9,"q":4,"metric":"match"},{"title":"المقصف المدرسي","label":"المدارس التي لديها فحص طبي ساري للعاملين بالمقصف","sec":10,"q":0,"metric":"yes"},{"title":"المقصف المدرسي","label":"المدارس التي تتابع المقصف أسبوعيًا","sec":10,"q":1,"metric":"yes"}];
const base='https://lfkrzgxmkbeleegvdxwx.supabase.co/rest/v1/',key='sb_publishable_IIxp8_3zYzBevJhdjV_Efg_WPM4Cuhc';let output=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path){const r=await fetch(base+path,{headers:{apikey:key}});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}async function load(){try{const [counts,schools]=await Promise.all([api('health_dashboard_counts?select=*'),api('school_public_progress?select=*&order=name.asc')]);const map=new Map(counts.map(r=>[r.field_key+'|'+r.question,r]));output=catalog.map(c=>{const r=map.get('section_'+c.sec+'|'+c.q);let v=r?(c.metric==='yes'?(r.answered?r.yes_count:null):c.metric==='match'?(r.answered?r.match_count:null):r[c.metric]):null;return [c.title,c.label,v??'']});$('rows').innerHTML=output.map((r,i)=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2]===''?'—':r[2])+'</td><td><button onclick="copyOne('+i+')" '+(r[2]===''?'disabled':'')+'>نسخ</button></td></tr>').join('');const n=schools.filter(s=>s.participated).length;$('stats').innerHTML='<div><b>'+schools.length+'</b>المدارس</div><div><b>'+n+'</b>المدارس المشاركة</div><div><b>'+schools.reduce((a,s)=>a+Number(s.documented_activities||0),0)+'</b>الأنشطة الأخرى</div>';$('schools').innerHTML=schools.map(s=>'<p>'+esc(s.name)+' — '+(s.participated?'شاركت':'لم تشارك')+' | '+esc(s.documented_sections)+' / 12</p>').join('');$('status').textContent='آخر تحديث: '+new Date().toLocaleString('ar-OM')}catch(e){$('status').textContent='تعذر تحميل البيانات: '+e.message}}async function copy(v){try{await navigator.clipboard.writeText(v);$('status').textContent='تم النسخ'}catch(e){alert('تعذر النسخ')}}function copyOne(i){copy(String(output[i][2]))}function copyNumbers(){copy(output.map(r=>r[2]).join('\n'))}function copyTable(){copy(output.map(r=>r.join('\t')).join('\n'))}function download(){const csv='\ufeff'+[['المجال','المؤشر','العدد'],...output].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='health-indicators.csv';a.click()}load();</script></html>
